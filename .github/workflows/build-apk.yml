name: Build APK

# Builds the Android wallpaper plugin + the Godot app, then publishes the APK as a GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build the wallpaper plugin (AAR)
        working-directory: android_plugin
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :plugin:assembleRelease --no-daemon --stacktrace
          mkdir -p ../addons/schedule_wallpaper/bin
          cp plugin/build/outputs/aar/ScheduleWallpaper-release.aar ../addons/schedule_wallpaper/bin/

      - name: Download Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot" && rm godot.zip
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* "$tdir/" && rm templates.tpz

      - name: Install the Android build template
        run: |
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p android/build
          unzip -q "$tdir/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Install the NDK Godot's template uses (lets Gradle strip debug symbols)
        run: |
          ndk=$(grep -rhoP 'ndkVersion\s*[:=]?\s*["\x27]\K[0-9.]+' android/build/*.gradle | head -1 || true)
          echo "Template NDK version: ${ndk:-none found}"
          if [ -n "$ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null || echo "::warning::Could not install NDK $ndk"
          fi

      - name: Configure Godot editor settings and signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          ks="$HOME/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with the key from the repo secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: signing with a throwaway key. Add the secrets so updates install over the old version."
            KEYSTORE_ALIAS=temp
            KEYSTORE_PASSWORD=temppassword
            keytool -genkeypair -keystore "$ks" -alias "$KEYSTORE_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Schedule Maker"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEYSTORE_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          # Version code goes up with every build so the phone accepts updates.
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"1.0.${{ github.run_number }}\"/" export_presets.cfg

      - name: Import project
        run: timeout 300 "$HOME/godot" --headless --editor --quit --path . || true

      - name: Export APK
        run: |
          mkdir -p build
          "$HOME/godot" --headless --path . --export-release "Android" build/ScheduleMaker.apk
          ls -la build
          test -f build/ScheduleMaker.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Schedule Maker 1.0.${{ github.run_number }}
          body: |
            Download **ScheduleMaker.apk** below on your Android phone and open it to install.
          files: build/ScheduleMaker.apk
          make_latest: true
